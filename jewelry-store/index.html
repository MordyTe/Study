<title>סטודיו נוגה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style id="site-style">
:root{
  --ink:#0E1E18; --ink-2:#122822;
  --panel:#152E26; --panel-2:#1A382E;
  --line:#25453A; --line-gold:rgba(198,161,91,.38);
  --gold:#C6A15B; --gold-2:#E9D4A0; --gold-dim:#8F7440;
  --ivory:#F3ECDC; --mist:#A6BAAE; --mist-2:#7E948A;
  --danger:#E09A9A; --ok:#8FD0AE;
  --serif:"Frank Ruhl Libre","Times New Roman",serif;
  --sans:"Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--sans); font-size:16px; line-height:1.6;
  color:var(--ivory); background:var(--ink);
  background-image:radial-gradient(1100px 520px at 50% -120px, #1A3A2F 0%, var(--ink) 62%);
}
img{max-width:100%} [hidden]{display:none!important}
::selection{background:var(--gold); color:#171106}
:focus-visible{outline:2px solid var(--gold-2); outline-offset:2px; border-radius:4px}
a{color:var(--gold-2)}
h1,h2,h3{text-wrap:balance}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px;
  padding:12px clamp(16px,4vw,40px); backdrop-filter:blur(10px);
  background:rgba(11,22,18,.82); border-bottom:1px solid var(--line);
}
.topbar .brand{font-family:var(--serif); font-size:20px; color:var(--gold-2); letter-spacing:.02em; text-decoration:none}
.topnav{display:flex; gap:20px; margin-inline-start:auto}
.topnav a{color:var(--mist); text-decoration:none; font-size:15px}
.topnav a:hover{color:var(--gold-2)}
.editbtn{
  display:flex; align-items:center; gap:7px; font:600 14px var(--sans);
  color:var(--gold); background:none; border:1px solid var(--gold-dim); border-radius:999px;
  padding:7px 14px; cursor:pointer; transition:all .2s;
}
.editbtn:hover{border-color:var(--gold); color:var(--gold-2)}
.editbtn.on{background:var(--gold); color:#1A1206; border-color:var(--gold)}
.editbtn svg{width:14px;height:14px;fill:currentColor}

/* ---------- hero ---------- */
.hero{padding:clamp(48px,8vw,88px) 20px 26px; text-align:center}
.hero .emblem{width:76px; height:76px; margin-bottom:10px}
.hero h1{
  font-family:var(--serif); font-weight:500; margin:0;
  font-size:clamp(40px,7.5vw,72px); line-height:1.15; color:var(--ivory);
}
.hero .tagline{max-width:52ch; margin:14px auto 0; color:var(--mist); font-size:clamp(16px,2.2vw,19px); font-weight:300}
.divider{display:flex; align-items:center; justify-content:center; gap:12px; margin:26px auto 0; color:var(--gold)}
.divider::before,.divider::after{content:""; width:min(120px,22vw); height:1px;
  background:linear-gradient(to var(--dir,left), var(--gold-dim), transparent)}
.divider::after{--dir:right}
.divider .gem{width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--gold);background:rgba(198,161,91,.25)}

/* ---------- chips ---------- */
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:22px 16px 8px}
.chip{
  font:600 14px var(--sans); color:var(--mist); background:none; cursor:pointer;
  border:1px solid var(--line); border-radius:999px; padding:8px 18px; transition:all .2s;
}
.chip:hover{border-color:var(--line-gold); color:var(--gold-2)}
.chip.on{background:var(--gold); border-color:var(--gold); color:#1A1206}

/* ---------- gallery ---------- */
.gallery{max-width:1180px; margin:26px auto 10px; padding:0 clamp(14px,3vw,28px);
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:22px}
.card{
  position:relative; text-align:right; background:linear-gradient(170deg,var(--panel-2),var(--panel) 55%);
  border:1px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer;
  transition:transform .35s ease, border-color .35s, box-shadow .35s;
  animation:rise .6s both;
}
.card:hover{transform:translateY(-4px); border-color:var(--line-gold); box-shadow:0 20px 44px rgba(0,0,0,.4)}
.card-art{aspect-ratio:1/1; display:block; background:#0C1913}
.card-art svg,.card-art img{width:100%; height:100%; display:block; object-fit:cover}
.card-info{padding:14px 18px 17px}
.card-info h3{margin:0; font:500 20px var(--serif); color:var(--ivory)}
.card-info .mat{margin:3px 0 10px; font-size:13.5px; color:var(--mist-2)}
.card-row{display:flex; align-items:baseline; justify-content:space-between}
.price{font:500 19px var(--serif); color:var(--gold-2); font-variant-numeric:tabular-nums}
.cta{font-size:13px; color:var(--mist-2); opacity:0; transform:translateX(6px); transition:all .3s}
.card:hover .cta{opacity:1; transform:none; color:var(--gold)}
.card-editbadge{
  position:absolute; top:10px; inset-inline-start:10px; z-index:2;
  font:600 12.5px var(--sans); color:var(--gold-2);
  background:rgba(10,20,16,.85); border:1px solid var(--gold-dim); border-radius:999px; padding:4px 12px;
}
.card.addtile{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  min-height:280px; background:none; border:1.5px dashed var(--gold-dim); color:var(--gold);
}
.card.addtile:hover{border-color:var(--gold); box-shadow:none}
.card.addtile .plus{font:300 52px var(--serif); line-height:1}
.card.addtile span{font:600 15px var(--sans)}
.empty-note{grid-column:1/-1; text-align:center; color:var(--mist-2); padding:40px 0}

/* ---------- sections ---------- */
.section{max-width:760px; margin:64px auto 0; padding:0 22px; text-align:center}
.section h2{font:500 30px var(--serif); color:var(--ivory); margin:0 0 14px}
.section p{color:var(--mist); font-size:17px; white-space:pre-line; margin:0}
footer{
  margin-top:72px; padding:34px 22px 44px; border-top:1px solid var(--line);
  text-align:center; color:var(--mist);
}
.contact-row{display:flex; flex-wrap:wrap; justify-content:center; gap:8px 28px; margin-bottom:14px; font-size:15.5px}
.contact-row .lbl{color:var(--gold); font-weight:600; margin-inline-end:6px; font-size:13.5px; letter-spacing:.04em}
.footnote{font-size:13.5px; color:var(--mist-2)}

/* ---------- overlay / dialogs ---------- */
.scrim{
  position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(5,11,9,.72); backdrop-filter:blur(4px); padding:18px; animation:fade .25s both;
}
.dialog{
  position:relative; width:min(880px,96vw); max-height:92vh; overflow:auto;
  background:linear-gradient(165deg,#16332A,#10241D 60%);
  border:1px solid var(--line-gold); border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.55); animation:pop .3s both;
}
.dialog .x{
  position:absolute; top:12px; inset-inline-end:12px; z-index:3; width:36px; height:36px;
  border-radius:50%; border:1px solid var(--line); background:rgba(10,20,16,.7);
  color:var(--mist); font-size:19px; line-height:1; cursor:pointer;
}
.dialog .x:hover{color:var(--ivory); border-color:var(--line-gold)}
.p-grid{display:grid; grid-template-columns:1fr 1.1fr}
.p-art{background:#0C1913; min-height:300px}
.p-art svg,.p-art img{width:100%; height:100%; object-fit:cover; display:block}
.p-body{padding:26px 28px 30px}
.p-kicker{font:600 13px var(--sans); color:var(--gold); letter-spacing:.14em; margin:0 0 4px}
.p-body h2{font:500 32px var(--serif); margin:0; color:var(--ivory)}
.p-body .mat{color:var(--mist-2); margin:4px 0 12px; font-size:14.5px}
.p-body .desc{color:var(--mist); margin:0 0 16px; max-width:56ch}
.price-line{display:flex; align-items:baseline; gap:10px; border-block:1px solid var(--line); padding:12px 0; margin-bottom:16px}
.price-line .price{font-size:26px}
.price-line .unit{font-size:13px; color:var(--mist-2)}
.orderform h3{font:500 20px var(--serif); color:var(--gold-2); margin:0 0 10px}
.fld{margin-bottom:12px}
.fld label{display:block; font:600 13px var(--sans); color:var(--gold); letter-spacing:.05em; margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%; font:400 15.5px var(--sans); color:var(--ivory);
  background:#0B1A14; border:1px solid var(--line); border-radius:10px; padding:10px 13px;
}
.fld textarea{min-height:70px; resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(198,161,91,.18)}
.fld .err{display:none; color:var(--danger); font-size:13px; margin-top:4px}
.fld.bad input{border-color:var(--danger)}
.fld.bad .err{display:block}
.two{display:grid; grid-template-columns:1fr 110px; gap:12px}
.btn{
  font:600 15.5px var(--sans); cursor:pointer; border-radius:11px; padding:11px 22px;
  border:1px solid var(--gold); color:#1A1206;
  background:linear-gradient(180deg,var(--gold-2),var(--gold)); transition:filter .2s;
}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45; cursor:default; filter:none}
.btn-ghost{background:none; border:1px solid var(--gold-dim); color:var(--gold)}
.btn-ghost:hover{border-color:var(--gold); color:var(--gold-2); filter:none}
.btn-danger{background:none; border:1px solid var(--danger); color:var(--danger)}
.fine{font-size:13px; color:var(--mist-2); margin:12px 0 0}
.success{padding:8px 0 4px}
.success .ok-ring{
  width:54px; height:54px; border-radius:50%; border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--gold-2); margin-bottom:12px;
}
.success h3{font:500 24px var(--serif); color:var(--ivory); margin:0 0 6px}
.success p{color:var(--mist); margin:0 0 8px}
.success .num{color:var(--gold-2); font-variant-numeric:tabular-nums}

/* ---------- editor dialog ---------- */
.editor{padding:26px 28px 30px}
.editor h2{font:500 26px var(--serif); color:var(--ivory); margin:0 0 18px}
.ed-grid{display:grid; grid-template-columns:220px 1fr; gap:22px}
.ed-preview{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#0C1913; align-self:start}
.ed-preview svg,.ed-preview img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block}
.ed-imgbtns{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.ed-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; align-items:center}
.ed-actions .spacer{flex:1}

/* ---------- orders drawer ---------- */
.orders{padding:26px 28px 30px}
.orders h2{font:500 26px var(--serif); color:var(--ivory); margin:0 0 6px}
.orders .src{color:var(--mist-2); font-size:13.5px; margin:0 0 16px}
.order-row{
  display:grid; grid-template-columns:1fr auto; gap:4px 14px; align-items:center;
  border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; background:rgba(11,25,19,.5);
}
.order-row .head{font-weight:600; color:var(--ivory)}
.order-row .head .price{font-size:15px; margin-inline-start:8px}
.order-row .meta{grid-column:1/-1; color:var(--mist); font-size:14px}
.order-row .meta .note{color:var(--mist-2)}
.order-row .when{color:var(--mist-2); font-size:12.5px; grid-column:1/-1}
.order-row .del{justify-self:end; grid-row:1; grid-column:2}
.mini{font:600 13px var(--sans); padding:5px 12px; border-radius:8px; cursor:pointer}

/* ---------- edit mode ---------- */
body.editing [data-edit]{cursor:text; outline:1.5px dashed var(--line-gold); outline-offset:5px; border-radius:4px; min-width:24px}
body.editing [data-edit]:focus{outline:1.5px solid var(--gold)}
body.editing [data-edit]:empty::before{content:"לחצו לעריכה"; color:var(--mist-2)}
.savebar{
  position:fixed; bottom:16px; right:50%; transform:translateX(50%); z-index:70;
  display:none; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
  max-width:min(96vw,760px); padding:10px 16px; border-radius:16px;
  background:rgba(9,19,15,.94); border:1px solid var(--gold-dim); box-shadow:0 16px 50px rgba(0,0,0,.5);
}
body.editing .savebar{display:flex}
.savebar .msg{font-size:14px; color:var(--mist); padding-inline-end:4px}
.savebar .msg b{color:var(--gold-2); font-weight:600}
.toast{
  position:fixed; bottom:86px; right:50%; transform:translateX(50%) translateY(8px); z-index:80;
  background:#0B1A14; border:1px solid var(--gold-dim); color:var(--ivory);
  border-radius:12px; padding:11px 20px; font-size:14.5px; opacity:0; pointer-events:none;
  transition:opacity .3s, transform .3s; max-width:92vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(50%) translateY(0)}

@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}
@keyframes pop{from{opacity:0; transform:scale(.97) translateY(8px)} to{opacity:1; transform:none}}
@media (max-width:720px){
  .topnav{display:none}
  .p-grid{grid-template-columns:1fr}
  .p-art{max-height:320px}
  .ed-grid{grid-template-columns:1fr}
  .ed-preview{max-width:240px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  html{scroll-behavior:auto}
}
</style>

/* ============================================================
   איורי SVG גנרטיביים — תכשיט נוצר מקטגוריה + מתכת + אבן
   ============================================================ */
function artSVG(p){
  var m = METALS[p.art && p.art.metal] || METALS.gold;
  var st = STONES[p.art && p.art.stone] || STONES.none;
  var id = 'g' + hashStr(p.id + (p.art?p.art.metal+p.art.stone:''));
  var r = rng(hashStr(p.id));
  var out = '<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="' + esc(p.name) + '" xmlns="http://www.w3.org/2000/svg">';
  out += '<defs>'
    + '<radialGradient id="bg'+id+'" cx="50%" cy="30%" r="80%">'
    +   '<stop offset="0%" stop-color="#1E4033"/><stop offset="100%" stop-color="#0B1913"/>'
    + '</radialGradient>'
    + '<linearGradient id="m'+id+'" x1="0" y1="0" x2="1" y2="1">'
    +   '<stop offset="0" stop-color="'+m.a+'"/><stop offset=".45" stop-color="'+m.b+'"/>'
    +   '<stop offset=".62" stop-color="'+m.b+'"/><stop offset="1" stop-color="'+m.c+'"/>'
    + '</linearGradient>';
  if(st.c){
    out += '<radialGradient id="s'+id+'" cx="38%" cy="30%" r="80%">'
      + '<stop offset="0" stop-color="'+st.hi+'"/><stop offset=".55" stop-color="'+st.c+'"/>'
      + '<stop offset="1" stop-color="'+shade(st.c)+'"/></radialGradient>';
  }
  out += '</defs>';
  out += '<rect width="400" height="400" fill="url(#bg'+id+')"/>';
  if(st.c){ out += '<rect width="400" height="400" fill="'+st.c+'" opacity="0.05"/>'; }
  out += '<ellipse cx="200" cy="352" rx="108" ry="14" fill="#000" opacity="0.3"/>';
  var M='url(#m'+id+')', S='url(#s'+id+')';
  var draw = { rings:ringArt, necklaces:necklaceArt, earrings:earringArt, bracelets:braceletArt }[p.cat] || ringArt;
  out += draw(M, S, st, m);
  for(var i=0;i<6;i++){
    var sx=40+320*r(), sy=30+150*r(), sr=2.2+3.4*r();
    out += '<polygon points="'+starPts(sx,sy,sr)+'" fill="'+(r()>0.5?'#FFF':'#E9D4A0')+'" opacity="'+(0.35+0.45*r()).toFixed(2)+'"/>';
  }
  return out + '</svg>';
}
function shade(hex){
  var n=parseInt(hex.slice(1),16);
  var rr=Math.round(((n>>16)&255)*0.45), gg=Math.round(((n>>8)&255)*0.45), bb=Math.round((n&255)*0.45);
  return 'rgb('+rr+','+gg+','+bb+')';
}
function starPts(cx,cy,rr){
  var s=rr*0.3;
  return [cx,cy-rr, cx+s,cy-s, cx+rr,cy, cx+s,cy+s, cx,cy+rr, cx-s,cy+s, cx-rr,cy, cx-s,cy-s]
    .map(function(v){return (+v).toFixed(1);}).join(' ');
}
function hexPts(cx,cy,rr,rot){
  var a=[]; for(var i=0;i<6;i++){ var t=rot+i*Math.PI/3;
    a.push((cx+rr*Math.cos(t)).toFixed(1), (cy+rr*Math.sin(t)).toFixed(1)); }
  return a.join(' ');
}
function gemHex(cx,cy,rr,S,st){
  var g = '<polygon points="'+hexPts(cx,cy,rr,-Math.PI/2)+'" fill="'+S+'" stroke="'+st.hi+'" stroke-width="1.2" stroke-opacity="0.6"/>';
  g += '<polygon points="'+hexPts(cx,cy,rr*0.55,-Math.PI/2)+'" fill="'+st.hi+'" opacity="0.3"/>';
  g += '<polygon points="'+starPts(cx-rr*0.3,cy-rr*0.35,rr*0.22)+'" fill="#FFF" opacity="0.85"/>';
  return g;
}
function gemDrop(cx,cy,w,h,S,st){
  var g = '<polygon points="'+[cx,cy-h/2, cx+w/2,cy, cx,cy+h/2, cx-w/2,cy].join(' ')+'" fill="'+S+'" stroke="'+st.hi+'" stroke-width="1.2" stroke-opacity="0.6"/>';
  g += '<polygon points="'+[cx,cy-h*0.28, cx+w*0.28,cy, cx,cy+h*0.28, cx-w*0.28,cy].join(' ')+'" fill="'+st.hi+'" opacity="0.3"/>';
  g += '<polygon points="'+starPts(cx-w*0.16,cy-h*0.16,4)+'" fill="#FFF" opacity="0.85"/>';
  return g;
}
function ringArt(M,S,st){
  var a = '<circle cx="200" cy="232" r="96" fill="none" stroke="'+M+'" stroke-width="17"/>';
  a += '<circle cx="200" cy="232" r="96" fill="none" stroke="#FFF" stroke-width="3" opacity="0.3" stroke-dasharray="105 500" transform="rotate(-150 200 232)" stroke-linecap="round"/>';
  if(st.c){
    a += '<circle cx="178" cy="141" r="6" fill="'+M+'"/><circle cx="222" cy="141" r="6" fill="'+M+'"/>';
    a += gemHex(200,124,31,S,st);
  }
  return a;
}
function necklaceArt(M,S,st){
  var a='';
  for(var i=0;i<=26;i++){
    var u=i/26, x=58+284*u, y=74+Math.pow(Math.sin(Math.PI*u),1.12)*176;
    a += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.6" fill="none" stroke="'+M+'" stroke-width="2.4"/>';
  }
  a += '<circle cx="200" cy="256" r="6.5" fill="none" stroke="'+M+'" stroke-width="3"/>';
  if(st.c){ a += gemDrop(200,316,62,106,S,st); }
  else{ a += '<circle cx="200" cy="308" r="30" fill="'+M+'"/><circle cx="192" cy="299" r="9" fill="#FFF" opacity="0.35"/>'; }
  return a;
}
function earringArt(M,S,st){
  var a='', xs=[132,268];
  for(var i=0;i<2;i++){
    var cx=xs[i];
    if(st.c){
      a += '<circle cx="'+cx+'" cy="118" r="7" fill="'+M+'"/>';
      a += '<line x1="'+cx+'" y1="125" x2="'+cx+'" y2="166" stroke="'+M+'" stroke-width="2.6"/>';
      a += gemDrop(cx,216,52,96,S,st);
    }else{
      a += '<circle cx="'+cx+'" cy="212" r="62" fill="none" stroke="'+M+'" stroke-width="11"/>';
      a += '<circle cx="'+cx+'" cy="212" r="62" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.32" stroke-dasharray="70 320" transform="rotate(-140 '+cx+' 212)" stroke-linecap="round"/>';
      a += '<circle cx="'+cx+'" cy="150" r="6.5" fill="'+M+'"/>';
    }
  }
  return a;
}
function braceletArt(M,S,st,m){
  var e1x=122.2, e2x=277.8, ey=137.2;
  var a = '<path d="M '+e1x+' '+ey+' A 110 110 0 1 0 '+e2x+' '+ey+'" fill="none" stroke="'+M+'" stroke-width="15" stroke-linecap="round"/>';
  a += '<path d="M 132 155 A 96 96 0 1 0 268 155" fill="none" stroke="#FFF" stroke-width="2.5" opacity="0.25"/>';
  a += '<circle cx="'+e1x+'" cy="'+ey+'" r="11" fill="'+M+'"/><circle cx="'+e2x+'" cy="'+ey+'" r="11" fill="'+M+'"/>';
  if(st.c){
    a += '<circle cx="'+e1x+'" cy="'+ey+'" r="6.5" fill="'+S+'" stroke="'+st.hi+'" stroke-opacity="0.6"/>';
    a += '<circle cx="'+e2x+'" cy="'+ey+'" r="6.5" fill="'+S+'" stroke="'+st.hi+'" stroke-opacity="0.6"/>';
  }
  return a;
}
function artOrImg(p){
  if(p.img){ return '<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">'; }
  return artSVG(p);
}

function onOrderSubmit(e){
  e.preventDefault();
  var form=e.target, p=findProduct(form.dataset.id); if(!p) return;
  var name=val('of-name'), phone=val('of-phone'), qty=parseInt(val('of-qty'),10)||1, note=val('of-note');
  var ok=true;
  ok = fieldCheck('of-name', name.length>=2) && ok;
  ok = fieldCheck('of-phone', /^[0-9+()\-\s]{7,20}$/.test(phone)) && ok;
  if(!ok) return;
  var order = { id:uid(), productId:p.id, product:p.name, unitPrice:p.price, qty:qty,
    total:p.price*qty, name:name, phone:phone, note:note, at:new Date().toISOString() };
  var btn=form.querySelector('.btn'); btn.disabled=true; btn.textContent='שולח…';
  submitOrder(order).then(function(where){
    var body=form.closest('.p-body');
    body.innerHTML = '<div class="success">'
      + '<div class="ok-ring">✓</div>'
      + '<h3>ההזמנה התקבלה</h3>'
      + '<p>'+esc(order.product)+' × '+qty+' · סה״כ <b class="num">'+fmtPrice(order.total)+'</b></p>'
      + '<p>מספר הזמנה: <span class="num">'+order.id.slice(0,6).toUpperCase()+'</span></p>'
      + '<p>'+esc(state.brand.orderNote)+'</p>'
      + (where==='local'?'<p class="fine">מצב הדגמה: ההזמנה נשמרה בדפדפן הזה בלבד ותופיע במסך ההזמנות של מצב העריכה.</p>':'')
      + '<button class="btn btn-ghost" data-act="close" style="margin-top:10px">חזרה לגלריה</button>'
      + '</div>';
  });
}
function submitOrder(order){
  if(dbNS){
    return dbNS.collection('orders').doc(order.id).set(order)
      .then(function(){ return 'db'; })
      .catch(function(){ pushLocalOrder(order); return 'local'; });
  }
  pushLocalOrder(order);
  return Promise.resolve('local');
}
function pushLocalOrder(order){ localOrders.unshift(order); saveOrders(); }

  var fld=document.getElementById(id).closest('.fld');

}

    + '<p class="fine">השינויים ייכנסו לתוקף רק אחרי «שמירה ופרסום» בסרגל התחתון.</p>'
    + '</form></div></div>';
  var form=document.getElementById('ed-form');
  form.addEventListener('submit', onEditorSave);
  form.addEventListener('input', onEditorInput);
  form.addEventListener('change', onEditorInput);
  document.getElementById('ed-img').addEventListener('change', onImgPick);
}
function onEditorInput(e){
  if(e.target.id==='ed-metal'||e.target.id==='ed-stone'){
    edP.art.metal=val('ed-metal'); edP.art.stone=val('ed-stone');
    if(!edP.img){ document.getElementById('ed-preview').innerHTML = artSVG(edP); }
  }
}
function onImgPick(e){
  var f=e.target.files && e.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var mx=900, sc=Math.min(1, mx/Math.max(img.width,img.height));
      var cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      edP.img = cv.toDataURL('image/jpeg',0.85);
      document.getElementById('ed-preview').innerHTML = artOrImg(edP);
      toast('התמונה נטענה — היא תישמר עם «שמירה ופרסום»');
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function onEditorSave(e){
  e.preventDefault();
  var name=val('ed-name'), price=parseInt(val('ed-price'),10);
  var ok = fieldCheck('ed-name', name.length>=1);
  ok = fieldCheck('ed-price', !isNaN(price)&&price>=0) && ok;
  if(!ok) return;
  edP.name=name; edP.price=price; edP.cat=val('ed-cat');
  edP.material=val('ed-material'); edP.desc=val('ed-desc');
  edP.art.metal=val('ed-metal'); edP.art.stone=val('ed-stone');
  if(edIsNew){ state.products.push(edP); }
  else{
    for(var i=0;i<state.products.length;i++){
      if(state.products[i].id===edP.id){ state.products[i]=edP; break; }
    }
  }
  closeOverlay(); markDirty(); render();
  toast(edIsNew?'המוצר נוסף — לחצו «שמירה ופרסום» כדי שיעלה לאתר':'המוצר עודכן — נותר לשמור ולפרסם');
}
var delArmed=false;
function onEditorDelete(btn){
  if(!delArmed){ delArmed=true; btn.textContent='בטוח? מחיקה סופית'; return; }
  state.products = state.products.filter(function(p){ return p.id!==edP.id; });
  closeOverlay(); markDirty(); render(); toast('המוצר הוסר — נותר לשמור ולפרסם');
}

/* ============================================================
   מסך הזמנות (מצב ניהול)
   ============================================================ */
function openOrders(){
  overlay.innerHTML = '<div class="scrim" data-act="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="הזמנות">'
    + '<button class="x" data-act="close" aria-label="סגירה">×</button>'
    + '<div class="orders"><h2>הזמנות שהתקבלו</h2><p class="src" id="orders-src"></p><div id="orders-list"></div></div>'
    + '</div></div>';
  dbOrders=null;
  if(dbNS){
    ordersUnsub = dbNS.collection('orders').orderBy('at','desc').limit(200).onSnapshot(function(snap){
      dbOrders = snap.docs.map(function(d){ return d.data(); });
      renderOrdersList();
    }, function(){ dbOrders=null; renderOrdersList(); });
  }
  renderOrdersList();
}
function renderOrdersList(){
  var list=document.getElementById('orders-list'); if(!list) return;
  var src=document.getElementById('orders-src');
  var rows=[];
  if(dbOrders){ rows = dbOrders.map(function(o){ return {o:o, from:'db'}; }); }
  localOrders.forEach(function(o){ rows.push({o:o, from:'local'}); });
  src.textContent = dbNS
    ? 'הזמנות מהאתר החי נשמרות במסד הנתונים של הארטיפקט; הזמנות שסומנו «דפדפן זה» נשמרו מקומית.'
    : 'מצב הדגמה ללא שרת — מוצגות הזמנות שנשמרו בדפדפן הזה בלבד.';
  if(!rows.length){ list.innerHTML='<p class="empty-note">עוד אין הזמנות. צאו ממצב עריכה ונסו לשלוח הזמנה מדף מוצר.</p>'; return; }
  list.innerHTML = rows.map(function(r){
    var o=r.o, when=new Date(o.at).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'});
    return '<div class="order-row">'
      + '<div class="head">'+esc(o.product)+' × '+esc(o.qty)+' <span class="price">'+fmtPrice(o.total)+'</span></div>'
      + '<button class="mini btn-danger del" data-act="order-del" data-id="'+esc(o.id)+'" data-from="'+r.from+'">הסרה</button>'
      + '<div class="meta">'+esc(o.name)+' · <span dir="ltr">'+esc(o.phone)+'</span>'
      + (o.note?' · <span class="note">'+esc(o.note)+'</span>':'')+'</div>'
      + '<div class="when">'+esc(when)+(r.from==='local'?' · דפדפן זה':'')+'</div>'
      + '</div>';
  }).join('');
}
function deleteOrder(id, from, btn){
  if(btn.dataset.armed!=='1'){ btn.dataset.armed='1'; btn.textContent='בטוח?'; return; }
  if(from==='db' && dbNS){ dbNS.collection('orders').doc(id).delete().catch(function(){ toast('המחיקה נכשלה — נסו שוב'); }); }
  else{ localOrders = localOrders.filter(function(o){ return o.id!==id; }); saveOrders(); renderOrdersList(); }
}

/* ============================================================
   מצב עריכה, שמירה ופרסום
   ============================================================ */
var savebar=document.createElement('div'); savebar.className='savebar'; document.body.appendChild(savebar);
var toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl);
var toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); }, 3600);
}
function updateBar(){
  if(!editMode){ savebar.innerHTML=''; return; }
  var target = artifactNS ? 'השינויים יפורסמו לכל מי שצופה באתר'
    : (capsReady ? 'מצב הדגמה — השינויים יישמרו בדפדפן הזה' : 'בודק חיבור…');
  var h = dirty
    ? '<span class="msg"><b>יש שינויים שלא נשמרו.</b> '+target+'</span>'
      + '<button class="btn" data-act="save">שמירה ופרסום</button>'
      + '<button class="btn btn-ghost" data-act="discard">ביטול שינויים</button>'
    : '<span class="msg">מצב עריכה פעיל — לחצו על כל טקסט או מוצר כדי לערוך</span>';
  h += '<button class="btn btn-ghost" data-act="orders">הזמנות'+(localOrders.length?' ('+localOrders.length+')':'')+'</button>'
    + '<button class="btn btn-ghost" data-act="exit-edit">סיום עריכה</button>';
  savebar.innerHTML=h;
}
function commitEdit(el){
  var path=el.dataset.edit.split('.'), v=el.innerText.replace(/\u00A0/g,' ').trim();
  var o=state; for(var i=0;i<path.length-1;i++){ o=o[path[i]]; }
  if(o[path[path.length-1]]===v) return;
  o[path[path.length-1]]=v;
  markDirty();
  if(el.dataset.edit==='brand.name'){ render(); }
}
function saveAll(){
  if(artifactNS){
    toast('מפרסם גרסה חדשה…');
    artifactNS.publish(buildDocument(state)).then(function(){
      try{ localStorage.removeItem(LSK); }catch(e){}
      /* התצוגה נטענת מחדש מיד עם הגרסה החדשה */
    }).catch(function(err){
      var code=err&&err.code;
      if(code==='conflict'){ toast('מישהו פרסם גרסה חדשה במקביל — הדף נטען מחדש'); return; }
      if(code==='not_writer'||code==='not_granted'){
        saveLocal(); toast('אין לך הרשאת פרסום לאתר — השינויים נשמרו בדפדפן זה בלבד');
      }else if(code==='too_large'){
        toast('הגרסה גדולה מדי לפרסום — נסו תמונות קטנות יותר');
      }else{
        saveLocal(); toast('הפרסום נכשל ('+esc(code||'שגיאה')+') — השינויים נשמרו בדפדפן זה');
      }
      savedSnapshot=clone(state); markDirty();
    });
    return;
  }
  if(saveLocal()){
    savedSnapshot=clone(state); markDirty();
    toast('נשמר בדפדפן הזה (מצב הדגמה — באתר החי השמירה מפרסמת לכולם)');
  }else{
    toast('השמירה נכשלה — ייתכן שהתמונות גדולות מדי לאחסון הדפדפן');
  }
}
function discardChanges(){
  state=clone(savedSnapshot);
  try{ localStorage.removeItem(LSK); }catch(e){}
  markDirty(); render(); toast('השינויים בוטלו');
}

/* בניית מסמך מלא לפרסום — מאותם מקורות שמהם הדף הזה עצמו בנוי */
function buildDocument(st){
  var json=JSON.stringify(st,null,1).replace(/</g,'\\u003c');
  var css=document.getElementById('site-style').textContent;
  var js=document.getElementById('site-script').textContent;
  return '<!doctype html>\n<html lang="he" dir="rtl">\n<head>\n'
    + '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<title>'+esc(st.brand.name||'סטודיו נוגה')+'<\/title>\n'
    + FONTS + '\n'
    + '<style id="site-style">'+css+'<\/style>\n'
    + '<\/head>\n<body>\n<div id="app"><\/div>\n<div id="overlay"><\/div>\n'
    + '<script type="application/json" id="site-data">\n'+json+'\n<\/scr'+'ipt>\n'
    + '<script id="site-script">'+js+'<\/scr'+'ipt>\n'
    + '<\/body>\n<\/html>\n';
}

/* ============================================================
   אירועים
   ============================================================ */
function closeOverlay(){
  overlay.innerHTML='';
  delArmed=false;
  if(ordersUnsub){ ordersUnsub(); ordersUnsub=null; }
}
document.addEventListener('click', function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.dataset.act;
  if(act==='toggle-edit'){ editMode=!editMode; render(); updateBar(); if(editMode){ toast('מצב עריכה: לחצו על טקסטים ומוצרים. «שמירה ופרסום» מקבעת הכול.'); } }
  else if(act==='exit-edit'){ editMode=false; render(); updateBar(); }
  else if(act==='filter'){ activeFilter=el.dataset.cat; render(); }
  else if(act==='open'){ if(e.target.closest('[data-edit]')) return; var p=findProduct(el.dataset.id); if(p){ editMode?openEditor(p):openProduct(p); } }
  else if(act==='add'){ openEditor(null); }
  else if(act==='close'){ closeOverlay(); }
  else if(act==='scrim'){ if(e.target===el) closeOverlay(); }
  else if(act==='save'){ saveAll(); }
  else if(act==='discard'){ discardChanges(); }
  else if(act==='orders'){ openOrders(); }
  else if(act==='order-del'){ deleteOrder(el.dataset.id, el.dataset.from, el); }
  else if(act==='ed-upload'){ document.getElementById('ed-img').click(); }
  else if(act==='ed-clearimg'){ edP.img=null; document.getElementById('ed-preview').innerHTML=artSVG(edP); el.remove(); }
  else if(act==='ed-del'){ onEditorDelete(el); }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target.matches && e.target.matches('.card[data-act="open"]')){ e.target.click(); }
  if(e.key==='Escape' && overlay.firstChild){ closeOverlay(); }
  if(e.key==='Enter' && e.target.matches && e.target.matches('[data-edit]') && e.target.tagName!=='P'){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('focusout', function(e){
  if(e.target.matches && e.target.matches('[data-edit]')){ commitEdit(e.target); }
});
document.addEventListener('paste', function(e){
  if(e.target.matches && e.target.matches('[data-edit]')){
    e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text');
    document.execCommand('insertText', false, t);
  }
});

/* ============================================================
   אתחול ויכולות פלטפורמה
   ============================================================ */
render(); updateBar();
(function(){
  if(!(window.claude && window.claude.use)){ capsReady=true; updateBar(); return; }
  Promise.all([
    window.claude.use('artifact').catch(function(){ return null; }),
    window.claude.use('db').catch(function(){ return null; })
  ]).then(function(res){
    artifactNS=res[0]; dbNS=res[1]; capsReady=true;
    if(artifactNS){
      var draft=loadLocal();
      if(draft && JSON.stringify(draft)===JSON.stringify(EMBED)){
        try{ localStorage.removeItem(LSK); }catch(e){}
      }else if(draft){
        savedSnapshot=clone(EMBED);
      }
    }
    markDirty(); updateBar();
  });
})();
</script>
