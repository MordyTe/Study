<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETH/USDT Signal Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>⚡ ETH/USDT Signal Agent</h1>
  <div id="conn" class="badge off">connecting…</div>
  <a href="/settings" class="badge" style="text-decoration:none">🔐 backoffice</a>
  <nav id="tf-switch">
    <button data-tf="1">1m</button>
    <button data-tf="5" class="active">5m</button>
    <button data-tf="15">15m</button>
    <button data-tf="60">1h</button>
    <button data-tf="240">4h</button>
  </nav>
</header>

<div id="banner" hidden></div>

<main>
  <section id="chart-wrap">
    <div id="chart"></div>
  </section>

  <aside>
    <div class="panel" id="state-panel">
      <h2>Market State</h2>
      <div id="state-body" class="kv">loading…</div>
    </div>
    <div class="panel" id="stats-panel">
      <h2>Performance</h2>
      <div id="stats-body" class="kv">–</div>
    </div>
  </aside>

  <section class="panel wide" id="signals-panel">
    <h2>Signals</h2>
    <table id="signals-table">
      <thead>
        <tr><th>time</th><th>style</th><th>dir</th><th>entry</th><th>SL</th>
            <th>TP1/2/3</th><th>R:R</th><th>conf</th><th>Gemini</th><th>state</th><th>R</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
