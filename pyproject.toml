[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-play"
version = "0.1.0"
description = "Computer-use agent for games and desktop apps: vision-first perception, ref-based actions, verified observe-act loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=2.0",
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
capture = ["mss>=9"]
input = ["pynput>=1.7"]
vision = ["opencv-python-headless>=4.9"]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8", "pytest-timeout>=2"]
all = ["agent-play[capture,input,vision,ocr,dev]"]

[project.scripts]
agent-play = "agent_play.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_play = ["skills/*.md", "skills/genres/*.md", "knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
