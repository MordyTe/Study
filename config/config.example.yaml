# studio-transcribe — example configuration.
# Copy to config/config.yaml and edit. Every field has a default; the minimum
# you need is the channel -> speaker map.

# --- ASR engine ---
engine: faster-whisper                    # faster-whisper (local) | cloud
model: ivrit-ai/whisper-large-v3-turbo-ct2  # ivrit.ai Hebrew fine-tune (best accuracy)
device: auto                              # auto | cuda | cpu
compute_type: auto                        # auto | float16 | int8_float16 | int8
language: he                              # forced; ivrit.ai models need explicit language
sample_rate: 16000

# Join adjacent same-speaker segments separated by <= this many seconds.
join_gap: 0.8

# Glossary of names / show terms / English brand+tech terms (one per line).
glossary_path: config/glossary.txt

# Persistent, searchable transcript DB (SQLite). Optional.
db_path: studio.db

# --- Channel -> speaker map (channel number = X32 mic = speaker) ---
channels:
  - { index: 1, speaker: "מנחה" }
  - { index: 2, speaker: "אורח 1" }
  - { index: 3, speaker: "אורח 2" }
  - { index: 4, speaker: "אורח 3", enabled: false }

# --- Voice Activity Detection (anti-hallucination) ---
vad:
  enabled: true
  threshold: 0.5            # higher = stricter
  min_speech_ms: 250
  min_silence_ms: 400
  speech_pad_ms: 150

# --- Decoding (tuned for Hebrew accuracy + anti-loop) ---
decode:
  beam_size: 5
  temperature: 0.0
  condition_on_previous_text: false   # true fuels repetition loops in Hebrew
  compression_ratio_threshold: 2.4
  log_prob_threshold: -1.0
  no_speech_threshold: 0.6
  word_timestamps: true

# --- Optional cloud fallback / live code-switching ---
cloud:
  enabled: false
  provider: soniox                 # soniox | elevenlabs | azure
  api_key_env: STUDIO_TRANSCRIBE_CLOUD_KEY

# --- Live captions (Stage 3): Soniox (cloud) -> OBS / vMix ---
# Live runs on the cloud (no local GPU during broadcast); the accurate archive
# is produced afterwards by the local ivrit.ai pass on the recording.
live:
  enabled: false
  engine: soniox                   # soniox (cloud) | zipformer (local, future)
  model: stt-rt-v4
  throttle_ms: 300                 # min ms between caption refreshes
  max_chars: 120                   # per caption line
  max_lines: 2                     # how many simultaneous speakers to show
  energy_threshold: 0.0001         # silence gate before streaming a channel
  sink: stdout                     # obs | vmix | file | stdout
  obs:
    host: localhost
    port: 4455
    password: ""
    source: captions               # name of the OBS Text (GDI+) source
  vmix:
    url: http://127.0.0.1:8088/api/
    input: ""                      # vMix input name/number of the Title
    field: Headline.Text           # title field to set
  file:
    path: captions.txt             # for OBS "text from file" / vMix Data Source

# --- Optional gated LLM post-correction (low-confidence segments only) ---
llm_correction:
  enabled: false
  logprob_threshold: -0.7
  compression_ratio_threshold: 2.4
  model: claude-opus-4-8

# --- Quick mic test (default microphone, zero-setup sanity check) ---
mic_test:
  model: ""          # empty -> use the main model above
  interval_s: 4.0    # transcribe the buffered speech every N seconds

# --- Operator web app (Stage 4): studio-transcribe serve ---
server:
  host: 127.0.0.1          # 0.0.0.0 to allow other machines on the studio LAN
  port: 8000
  password_env: STUDIO_TRANSCRIBE_PASSWORD   # set this env var to require a password
