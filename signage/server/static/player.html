<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>תצוגה</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;
  font-family:Heebo,Assistant,"Noto Sans Hebrew","Segoe UI",Arial,sans-serif}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .8s;background:#000}
iframe.on{opacity:1}
#setup{position:absolute;inset:0;display:none;background:#0f172a;color:#f8fafc;align-items:center;justify-content:center;gap:6vw;padding:6vh 6vw}
#setup.on{display:flex}
#setup img{width:36vh;height:36vh;border-radius:2vh;background:#fff}
#setup h1{font-size:8vh;margin:0 0 3vh}
#setup p{font-size:4vh;margin:0 0 2vh;opacity:.85}
#chip{position:absolute;bottom:2vh;right:2vw;background:rgba(0,0,0,.72);color:#fff;padding:1vh 1.4vw;border-radius:1.2vh;font-size:2.6vh;direction:ltr;z-index:5}
#setup .url{font-size:4.6vh;color:#fbbf24;direction:ltr;text-align:right;font-weight:700}
</style>
</head>
<body>
<iframe id="a" title="שקופית"></iframe>
<iframe id="b" title="שקופית"></iframe>
<div id="setup">
  <img id="qr" alt="קוד QR לדף הניהול" hidden>
  <div>
    <h1 id="s-title"></h1>
    <p id="s-line"></p>
    <p class="url" id="url"></p>
    <p id="s-foot"></p>
  </div>
</div>
<div id="chip" hidden></div>
<script>
(function(){
  var frames=[document.getElementById('a'),document.getElementById('b')], front=0;
  var slides=[], version=null, index=-1, timer=null, shownAt=0;
  var setup=document.getElementById('setup'), shownUrl='', bootedAt=Date.now();
  function text(id,t){ document.getElementById(id).textContent=t; }
  var MAX_VIDEO=20*60*1000;       // safety net if a video never reports that it ended
  var REFRESH_SINGLE=10*60*1000;  // one slide only: reload so computed times stay current

  function show(i){
    clearTimeout(timer);
    if(!slides.length) return;
    index=i%slides.length;
    var slide=slides[index], back=frames[1-front], done=false;
    function swap(){
      if(done) return; done=true;
      back.classList.add('on'); frames[front].classList.remove('on'); front=1-front; shownAt=Date.now();
      duck();
      var wait=slide.wait_end ? MAX_VIDEO : (slides.length>1 ? slide.duration*1000 : REFRESH_SINGLE);
      timer=setTimeout(function(){ show(index+1); }, wait);
    }
    back.onload=swap;
    setTimeout(swap, 4000);            // never get stuck on a slow load
    back.src='/render/'+slide.id+'?v='+version+'&t='+Date.now();
  }

  // ---- background music: uploaded songs or an internet radio stream ----
  var audio=new Audio(), tune={mode:'off'}, tuneKey='', order=[], track=0, retry=null;
  function nextTrack(){
    if(tune.mode!=='playlist' || !order.length) return;
    track=(track+1)%order.length; audio.src='/uploads/'+order[track]; audio.play().catch(function(){});
  }
  function startMusic(){
    clearTimeout(retry); audio.pause(); audio.removeAttribute('src'); audio.load();
    if(tune.mode==='playlist' && tune.tracks.length){
      order=tune.tracks.slice();
      if(tune.shuffle) for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), x=order[i]; order[i]=order[j]; order[j]=x; }
      track=-1; nextTrack();
    } else if(tune.mode==='radio'){
      audio.src=tune.url; audio.play().catch(function(){});
    }
    duck();
  }
  audio.addEventListener('ended', function(){ if(tune.mode==='playlist') nextTrack(); else again(); });
  audio.addEventListener('error', function(){ again(); });
  function again(){   // a broken file or a dropped stream: wait a little, then move on / reconnect
    clearTimeout(retry);
    retry=setTimeout(function(){ if(tune.mode==='playlist') nextTrack(); else if(tune.mode==='radio'){ audio.src=tune.url; audio.play().catch(function(){}); } }, tune.mode==='radio'?10000:2000);
  }
  function duck(){    // a video with its own sound takes over; the music comes back afterwards
    var loud = index>=0 && slides[index] && slides[index].has_sound;
    audio.volume = loud ? 0 : (tune.volume||0)/100;
    if(tune.mode==='playlist'){ if(loud) audio.pause(); else if(audio.paused && audio.src) audio.play().catch(function(){}); }
  }
  function setMusic(m){
    var key=JSON.stringify([m.mode,m.url,m.tracks,m.shuffle]);
    tune=m;
    if(key!==tuneKey){ tuneKey=key; startMusic(); } else duck();   // volume-only change: no restart
  }

  function poll(){
    fetch('/api/playlist',{cache:'no-store'}).then(function(r){return r.json()}).then(function(p){
      var changed = p.version!==version || JSON.stringify(p.slides)!==JSON.stringify(slides);
      version=p.version; slides=p.slides;
      setMusic(p.music||{mode:'off'});
      var chip=document.getElementById('chip');
      if(!slides.length){
        clearTimeout(timer); index=-1;
        frames.forEach(function(f){f.classList.remove('on')});
        var qr=document.getElementById('qr');
        if(!p.network){            // no address yet: say so instead of showing a useless one
          text('s-title','ממתין לחיבור לרשת'); text('s-line','חברו את המכשיר לנתב בכבל רשת.');
          text('url',''); text('s-foot','הכתובת תופיע כאן לבד ברגע שהמכשיר יתחבר.'); qr.hidden=true; shownUrl='';
        } else {
          text('s-title', p.setup_done ? 'המסך ריק' : 'ברוכים הבאים');
          text('s-line', p.setup_done ? 'כדי להוסיף תוכן, פתחו בטלפון או במחשב:' : 'כדי להגדיר את המסך, סרקו את הקוד או פתחו בטלפון:');
          text('url', p.admin_url.replace('http://','')); text('s-foot','הטלפון צריך להיות מחובר לאותה רשת.');
          if(p.admin_url!==shownUrl){ shownUrl=p.admin_url; qr.src='/api/qr.svg?t='+Date.now(); }   // address changed: new code
          qr.hidden=false;
        }
        setup.classList.add('on'); chip.hidden=true;
      } else {
        setup.classList.remove('on');
        // for two minutes after start-up, keep the address in a corner so it can still be found
        chip.hidden = !(p.network && Date.now()-bootedAt < 120000);
        chip.textContent = p.admin_url.replace('http://','');
        if(changed) show(Math.max(index,0));
      }
    }).catch(function(){ /* server unreachable: keep showing what we have */ });
  }
  // a video slide tells us when it finished; only the slide on screen may advance the show
  window.addEventListener('message', function(e){
    if(e.data==='slide-ended' && e.source===frames[front].contentWindow && slides[index] && slides[index].wait_end) show(index+1);
  });
  function report(){
    fetch('/api/display',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({width:Math.round(innerWidth*devicePixelRatio),height:Math.round(innerHeight*devicePixelRatio)})}).catch(function(){});
  }
  report(); setInterval(report, 15000); window.addEventListener('resize', report);
  poll(); setInterval(poll, 5000);
})();
</script>
</body>
</html>
