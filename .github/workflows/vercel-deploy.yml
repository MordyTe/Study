name: Deploy to Vercel

# Guarantees every push deploys, independent of Vercel's GitHub webhook:
# pings the project's Deploy Hook, which builds the branch HEAD.
# The hook URL lives in the repo secret VERCEL_DEPLOY_HOOK
# (GitHub → Settings → Secrets and variables → Actions).
# Without the secret this job is a silent no-op, so it never spams
# failure emails while Vercel's native auto-deploy is doing the work.

on:
  push:
    branches:
      - claude/eth-usdt-trading-agent-at1bwd

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK secret not set — skipping (native Vercel auto-deploy assumed)"
            exit 0
          fi
          curl -sS --fail -X POST "$HOOK"
          echo "Vercel build triggered for $GITHUB_SHA"
